apiVersion: apps/v1
kind: Deployment
metadata:
  name: setmeup-admin-ecomerence23-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: setmeup-admin-ecomerence23-frontend
  template:
    metadata:
      labels:
        app: setmeup-admin-ecomerence23-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: setmeup-admin-ecomerence23-frontend
          image: paxarisdocker/setmeup-admin-ecomerence23-frontend:274380afe32a9321e683c0e1fc438e295d151bc4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: setmeup-admin-ecomerence23-frontend
spec:
  selector:
    app: setmeup-admin-ecomerence23-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32100
  type: NodePort
